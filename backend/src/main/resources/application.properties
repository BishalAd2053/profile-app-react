server.port=8080
spring.application.name=profile-backend
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# Persisted profile data location (overridden in Docker via env: APP_PROFILE_DATA_PATH)
app.profile.data-path=./data/profile.json

# Admin credentials (overridden in Docker via env: APP_ADMIN_USERNAME / APP_ADMIN_PASSWORD)
app.admin.username=admin
app.admin.password=admin

# OpenRouter API key (overridden in Docker/Render via env: APP_OPENROUTER_API_KEY)
app.openrouter.api-key=${APP_OPENROUTER_API_KEY:}

# EmailJS credentials (overridden in Docker/Render via env vars)
app.emailjs.service-id=${APP_EMAILJS_SERVICE_ID:}
app.emailjs.template-id=${APP_EMAILJS_TEMPLATE_ID:}
app.emailjs.public-key=${APP_EMAILJS_PUBLIC_KEY:}
app.emailjs.private-key=${APP_EMAILJS_PRIVATE_KEY:}
